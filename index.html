<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sóng – Nghe nhạc MP3</title>
<meta name="apple-mobile-web-app-title" content="Sóng">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --panel:#121212; --elev:#1f1f1f; --elev2:#2a2a2a; --hover:rgba(255,255,255,.08);
  --text:#fff; --sub:#a7a7a7; --accent:#22d36b; --accent2:#1fb85e;
  --tabh:58px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
.ic{display:block;flex:none}
.hidden-file{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}

/* ---------- layout (desktop) ---------- */
#app{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;grid-template-rows:minmax(0,1fr) 84px;gap:8px;padding:8px 8px 0;height:100vh;height:100dvh}
#app.no-right{grid-template-columns:300px minmax(0,1fr)}
#app.no-right #rightPanel{display:none}
#sidebar{display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--panel);border-radius:10px}
#main{background:var(--panel);border-radius:10px;overflow-y:auto;overflow-x:hidden;position:relative;min-height:0;scrollbar-width:thin;scrollbar-color:#555 transparent}
#rightPanel{background:var(--panel);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#rp{display:flex;flex-direction:column;min-height:0;height:100%}
#playerBar{grid-column:1/-1;display:grid;grid-template-columns:minmax(180px,30%) minmax(0,40%) minmax(180px,30%);align-items:center;padding:0 8px}
@media (max-width:1199px){ #app{grid-template-columns:280px minmax(0,1fr)} #rightPanel{display:none} }

/* sidebar */
.side-nav{padding:14px 12px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 12px 14px;font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#000}
.snav{display:flex;align-items:center;gap:18px;width:100%;padding:10px 12px;border-radius:6px;color:var(--sub);font-weight:700;font-size:15px;transition:color .15s}
.snav:hover,.snav.active{color:#fff}
.side-lib{flex:1;display:flex;flex-direction:column;min-height:0}
.sl-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sl-title{display:flex;align-items:center;gap:12px;color:var(--sub);font-weight:700;font-size:15px}
.sl-chips{display:flex;gap:8px;padding:8px 16px 8px;flex-wrap:wrap}
.chip{background:var(--elev2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.chip:hover{background:#3a3a3a}
.chip.on{background:#fff;color:#000}
.sl-list{flex:1;overflow-y:auto;padding:4px 8px 8px;scrollbar-width:thin;scrollbar-color:#555 transparent}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:6px;text-align:left}
.li:hover{background:var(--hover)}
.li.active{background:rgba(255,255,255,.12)}
.li.ctx .t1{color:var(--accent)}
.li .spk{margin-left:auto;color:var(--accent)}

/* covers */
.cov{position:relative;overflow:hidden;border-radius:4px;background:#282828;flex:none;display:grid;place-items:center;color:rgba(255,255,255,.75)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov.ph{background:linear-gradient(135deg,hsl(var(--h) 45% 38%),hsl(calc(var(--h) + 40) 50% 18%))}
.cov.liked{background:linear-gradient(135deg,#4527a0,#5a7be8 55%,#8fe3c0);color:#fff}
.cov.allc{background:linear-gradient(135deg,#0f5c3a,#22d36b);color:#fff}
.cov.round{border-radius:50%}
.cov-sm{width:40px;height:40px}
.cov-li{width:48px;height:48px}
.cov-pb{width:56px;height:56px}
.cov-q{width:44px;height:44px}
.cov-xl{width:100%;aspect-ratio:1;height:auto;border-radius:8px}
.cov-card{width:100%;aspect-ratio:1;height:auto;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cov-head{width:232px;height:232px;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
.cov-quick{width:64px;height:64px;border-radius:4px 0 0 4px}
.cov-sm .ic,.cov-li .ic,.cov-q .ic{width:20px;height:20px}
.cov-pb .ic{width:24px;height:24px}
.cov-xl .ic,.cov-card .ic,.cov-head .ic{width:38%;height:38%}

.tt{min-width:0;flex:1}
.t1{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.link{cursor:pointer}
@media (hover:hover){.link:hover{text-decoration:underline;color:#fff}}

/* buttons */
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--sub);transition:color .15s,transform .1s;position:relative}
.ibtn:hover{color:#fff}
.ibtn.sm{width:32px;height:32px}
.ibtn.on{color:var(--accent)}
.ibtn.on::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.ibtn.rep1::before{content:"1";position:absolute;top:3px;right:3px;font-size:9px;font-weight:800;background:var(--accent);color:#000;border-radius:50%;width:12px;height:12px;line-height:12px;text-align:center}
.ibtn:active{transform:scale(.92)}
.like.on{color:var(--accent)}
.playbtn{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;transition:transform .1s}
.playbtn:hover{transform:scale(1.06)}
.playbtn:active{transform:scale(.95)}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.3);transition:transform .1s,background .15s}
.bigplay:hover{transform:scale(1.05);background:#3be07f}
.bigplay:active{transform:scale(.96)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #727272;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.pill:hover{border-color:#fff;transform:scale(1.03)}
.pill.solid{background:#fff;color:#000;border-color:#fff}

/* range */
.range{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:18px;margin:0;cursor:pointer;--p:0%;--fill:#fff;--thumb:0}
.range:focus{outline:none}
.range::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill) var(--p),rgba(255,255,255,.28) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:var(--thumb);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.range::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.28)}
.range::-moz-range-progress{height:4px;border-radius:2px;background:var(--fill)}
.range::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;opacity:var(--thumb)}
@media (hover:hover){.range:hover{--fill:var(--accent);--thumb:1}}
.range:active{--fill:var(--accent);--thumb:1}

/* player bar */
.pb-left{display:flex;align-items:center;gap:12px;min-width:0;padding-left:6px}
.pb-left .tt{flex:0 1 auto}
.pb-center{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:720px;width:100%;justify-self:center}
.pb-ctrls{display:flex;align-items:center;gap:14px}
.pb-prog{display:flex;align-items:center;gap:8px;width:100%}
.tm{font-size:12px;color:var(--sub);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.pb-right{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:8px}
.pb-right .vol{width:110px}

/* views */
.vwrap{min-height:100%;background:linear-gradient(to bottom,var(--c,#2b2b2b) 0,rgba(18,18,18,.0) 360px),var(--panel);padding-bottom:40px}
.vwrap.plain{background:var(--panel)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 24px;min-height:56px}
.topbar .back{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.topbar h2{margin:0;font-size:22px;font-weight:800}
.lh{display:flex;align-items:flex-end;gap:24px;padding:12px 24px 24px}
.lh-kind{font-size:13px;font-weight:600}
.lh-title{margin:6px 0 10px;font-size:clamp(32px,6vw,84px);font-weight:800;letter-spacing:-.04em;line-height:1.02;word-break:break-word}
.lh-sub{font-size:14px;color:rgba(255,255,255,.8)}
.actions{display:flex;align-items:center;gap:20px;padding:20px 24px;background:linear-gradient(rgba(0,0,0,.18),transparent)}
.actions .ibtn{width:40px;height:40px}
.actions .grow{flex:1}
.thead{display:grid;grid-template-columns:44px minmax(0,4fr) minmax(0,3fr) minmax(0,2fr) 140px;gap:16px;padding:0 16px;margin:0 24px 8px;height:36px;align-items:center;border-bottom:1px solid rgba(255,255,255,.1);color:var(--sub);font-size:13px}
.thead .c-num{text-align:center}
.thead .c-dur{display:flex;justify-content:flex-end;padding-right:40px}
.rows{padding:0 24px}
.row{display:grid;grid-template-columns:44px minmax(0,4fr) minmax(0,3fr) minmax(0,2fr) 140px;gap:16px;padding:0 16px;height:58px;align-items:center;border-radius:6px;cursor:pointer;color:var(--sub);font-size:14px}
.row .c-num{display:grid;place-items:center;font-variant-numeric:tabular-nums}
.row .row-play{display:none;color:#fff}
.row .eq{display:none}
.c-title{display:flex;align-items:center;gap:12px;min-width:0}
.c-title .t1{color:#fff;font-weight:500}
.c-album,.c-added{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-dur{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.c-dur .dur{min-width:40px;text-align:right;font-variant-numeric:tabular-nums}
.row .like,.row .more{opacity:0}
.row .like.on{opacity:1}
@media (hover:hover){
  .row:hover{background:var(--hover)}
  .row:hover .num{display:none}
  .row:hover .row-play{display:grid}
  .row:hover .like,.row:hover .more{opacity:1}
  .row:hover .eq{display:none!important}
}
.row.playing .t1{color:var(--accent)}
.row.playing .num{display:none}
.row.playing .eq{display:flex}
.eq{gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
body.is-paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

.sec{padding:0 24px;margin-top:28px}
.sec h3{font-size:22px;font-weight:800;margin:0 0 14px;letter-spacing:-.02em}
.hello{font-size:30px;font-weight:800;margin:0;padding:24px 24px 0;letter-spacing:-.02em}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;padding:18px 24px 0}
.qcard{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;text-align:left;position:relative;transition:background .2s;height:64px}
.qcard:hover{background:rgba(255,255,255,.18)}
.qcard .t1{font-weight:700;font-size:15px;padding-right:56px}
.qcard .cplay{position:absolute;right:10px;top:50%;margin-top:-18px;width:36px;height:36px;opacity:0}
.qcard:hover .cplay,.qcard .cplay.show{opacity:1}
.cplay{border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;box-shadow:0 8px 16px rgba(0,0,0,.4);transition:opacity .2s,transform .2s}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:180px;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.tcard{padding:12px;border-radius:8px;text-align:left;transition:background .2s;scroll-snap-align:start;position:relative}
.tcard:hover{background:#1f1f1f}
.tcard .cwrap{position:relative;margin-bottom:10px}
.tcard .cplay{position:absolute;right:8px;bottom:8px;width:46px;height:46px;opacity:0;transform:translateY(8px)}
.tcard:hover .cplay,.tcard .cplay.show{opacity:1;transform:none}
.tcard .t1{font-size:15px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.tile{position:relative;border-radius:8px;height:110px;padding:14px;overflow:hidden;text-align:left;font-weight:800;font-size:18px;line-height:1.2}
.tile .cov{position:absolute;right:-14px;bottom:-6px;width:80px;height:80px;transform:rotate(25deg);box-shadow:0 4px 12px rgba(0,0,0,.4)}

.empty{padding:40px 24px;text-align:center;color:var(--sub)}
.empty h2{color:#fff;font-size:24px;margin:16px 0 8px;font-weight:800}
.empty p{max-width:440px;margin:0 auto 20px;line-height:1.55}
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;min-height:70%}
.welcome .big{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;margin-bottom:22px;box-shadow:0 10px 40px rgba(34,211,107,.35)}
.welcome h1{font-size:30px;font-weight:800;margin:0 0 10px;letter-spacing:-.02em}
.welcome p{color:var(--sub);max-width:460px;line-height:1.6;margin:0 0 24px}
.steps{text-align:left;background:rgba(255,255,255,.06);border-radius:10px;padding:16px 18px;max-width:440px;margin-top:28px;color:var(--sub);font-size:14px;line-height:1.6}
.steps b{color:#fff}
.steps ol{margin:6px 0 0;padding-left:20px}

.search-box{display:flex;align-items:center;gap:10px;background:#242424;border-radius:999px;padding:0 16px;margin:4px 24px 20px;height:48px;border:2px solid transparent;color:var(--sub);transition:border-color .15s}
.search-box:focus-within{border-color:#fff;color:#fff}
.search-box input{flex:1;background:none;border:0;color:#fff;outline:none;font-size:16px;min-width:0}
.search-box input::-webkit-search-cancel-button{-webkit-appearance:none}
.artist-chips{display:flex;gap:16px;overflow-x:auto;padding:0 24px 16px;scrollbar-width:none}
.achip{display:flex;flex-direction:column;align-items:center;gap:8px;width:110px;flex:none;text-align:center;font-size:13px;font-weight:600}
.achip .cov{width:96px;height:96px}

.qsec{font-weight:700;font-size:15px;padding:16px 16px 8px}
.qi{display:flex;align-items:center;gap:12px;padding:6px 8px;margin:0 8px;border-radius:6px;cursor:pointer}
.qi:hover{background:var(--hover)}
.qi.now .t1{color:var(--accent)}
.qi .ibtn{opacity:.6}
.qi:hover .ibtn{opacity:1}

/* right panel */
.rp-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;font-size:15px;min-height:52px}
.rp-head b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-scroll{flex:1;overflow-y:auto;padding:0 0 16px;scrollbar-width:thin;scrollbar-color:#555 transparent}
.rp-cover{padding:8px 16px}
.rp-meta{display:flex;align-items:center;gap:8px;padding:12px 16px 4px}
.rp-title{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-artist{color:var(--sub);font-size:15px;margin-top:2px}
.rp-box{background:#242424;border-radius:8px;margin:16px 16px 0;padding:12px 4px 8px}
.rp-box .bh{display:flex;justify-content:space-between;align-items:center;padding:0 12px 8px;font-weight:700;font-size:15px}
.rp-box .bh button{font-size:13px;color:var(--sub);font-weight:600}
.rp-box .bh button:hover{color:#fff;text-decoration:underline}
.rp-box .qi{margin:0 4px}
.rp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);text-align:center;padding:24px;gap:10px}

/* mini + tabbar + sheet (mobile) */
#mini,#tabbar,#sheet{display:none}

/* menu */
#menu{position:fixed;inset:0;z-index:50;display:none}
#menu.open{display:block}
.mbg{position:absolute;inset:0}
#menuBox{position:absolute;width:250px;background:#282828;border-radius:6px;padding:4px;box-shadow:0 16px 40px rgba(0,0,0,.6);max-height:70vh;overflow-y:auto}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:3px;font-size:14px;text-align:left;color:#e6e6e6}
.mi:hover{background:#3e3e3e}
.mi span{flex:1}
.mi.danger{color:#ff6b6b}
.msep{height:1px;background:rgba(255,255,255,.1);margin:4px 0}
.mhead{display:none}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#modal.open{display:flex}
#modal .mbg{background:rgba(0,0,0,.7)}
#modalBox{position:relative;width:100%;max-width:420px;background:#282828;border-radius:10px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modalBox h3{margin:0 0 14px;font-size:20px;font-weight:800}
#modalBox p{color:var(--sub);margin:0 0 18px;line-height:1.5}
#modalBox label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 6px}
#modalBox input{width:100%;background:#3e3e3e;border:1px solid transparent;border-radius:6px;padding:12px;color:#fff;font-size:16px;outline:none}
#modalBox input:focus{border-color:#7a7a7a;background:#333}
.mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.btn{padding:12px 22px;border-radius:999px;font-weight:700;font-size:14px}
.btn.ghost{color:#fff}
.btn.ghost:hover{transform:scale(1.04)}
.btn.pri{background:#fff;color:#000}
.btn.pri:hover{transform:scale(1.04)}
.btn.dng{background:#e5484d;color:#fff}

#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:#3b82f6;background:#fff;color:#000;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#drop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;pointer-events:none}
#drop.show{display:flex}
#drop div{border:3px dashed var(--accent);border-radius:16px;padding:40px 60px;font-size:22px;font-weight:800;color:var(--accent)}
.muted{color:var(--sub)}
.pad{padding:16px}

/* ---------- MOBILE ---------- */
@media (max-width:899px){
  #app{display:block;padding:0;height:100vh;height:100dvh}
  #sidebar,#rightPanel,#playerBar{display:none!important}
  #main{height:100%;border-radius:0;background:var(--panel)}
  #view{padding-bottom:calc(var(--tabh) + var(--safe-b) + 24px)}
  body.has-track #view{padding-bottom:calc(var(--tabh) + var(--safe-b) + 92px)}
  .vwrap{padding-top:var(--safe-t)}
  .topbar{padding:10px 16px;min-height:52px;top:0}
  .hello{padding:16px 16px 0;font-size:24px}
  .quick{grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px 0}
  .qcard{height:56px;gap:10px}
  .qcard .t1{font-size:13px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;padding-right:6px}
  .qcard .cov-quick{width:56px;height:56px}
  .qcard .cplay{display:none}
  .sec{padding:0 16px;margin-top:26px}
  .sec h3{font-size:20px}
  .hscroll{grid-auto-columns:140px;gap:4px;margin:0 -8px;padding:0 8px}
  .tcard{padding:8px}
  .tcard .cplay{display:none}
  .grid-cards{grid-template-columns:1fr 1fr}

    if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33)return out;

    out.tagEnd=10+size+((flags&0x10)?10:0);
    let buf=new Uint8Array(await file.slice(10,10+size).arrayBuffer());
    if((flags&0x80)&&ver<4){const o=new Uint8Array(buf.length);let n=0;for(let i=0;i<buf.length;i++){o[n++]=buf[i];if(buf[i]===0xFF&&buf[i+1]===0)i++;}buf=o.subarray(0,n);}
    let p=0;
    if((flags&0x40)&&ver>=3)p=ver===4?syncsafe(buf,0):be32(buf,0)+4;
    const idLen=ver===2?3:4,hl=ver===2?6:10;
    while(p+hl<=buf.length){
      const id=String.fromCharCode(...buf.subarray(p,p+idLen));
      if(!/^[A-Z0-9]{3,4}$/.test(id))break;
      let fs;if(ver===2)fs=buf[p+3]<<16|buf[p+4]<<8|buf[p+5];else if(ver===4)fs=syncsafe(buf,p+4);else fs=be32(buf,p+4);
      const ff=ver===2?0:(buf[p+8]<<8|buf[p+9]);
      const st=p+hl,en=st+fs;if(fs<=0||en>buf.length)break;
      let d=buf.subarray(st,en);if(ver===4&&(ff&1))d=d.subarray(4);
      if(id==='TIT2'||id==='TT2')out.title=decStr(d.subarray(1),d[0]);
      else if(id==='TPE1'||id==='TP1')out.artist=decStr(d.subarray(1),d[0]);
      else if(id==='TALB'||id==='TAL')out.album=decStr(d.subarray(1),d[0]);
      else if((id==='APIC'||id==='PIC')&&!out.cover)out.cover=decPic(d,ver===2);
      p=en;
    }
  }catch(e){}
  return out;
}
async function mp3Duration(file,off){
  try{
    const b=new Uint8Array(await file.slice(off,off+131072).arrayBuffer());
    const V1=[0,32,40,48,56,64,80,96,112,128,160,192,224,256,320],V2=[0,8,16,24,32,40,48,56,64,80,96,112,128,144,160];
    for(let i=0;i<b.length-48;i++){
      if(b[i]!==0xFF||(b[i+1]&0xE0)!==0xE0)continue;
      const ver=(b[i+1]>>3)&3,layer=(b[i+1]>>1)&3,bi=(b[i+2]>>4)&15,si=(b[i+2]>>2)&3;
      if(ver===1||layer!==1||bi===0||bi===15||si===3)continue;
      const v1=ver===3,br=(v1?V1:V2)[bi]*1000;
      const sr=(ver===3?[44100,48000,32000]:ver===2?[22050,24000,16000]:[11025,12000,8000])[si];
      const spf=v1?1152:576,mono=((b[i+3]>>6)&3)===3;
      const xo=i+4+(v1?(mono?17:32):(mono?9:17));
      const tag=String.fromCharCode(b[xo],b[xo+1],b[xo+2],b[xo+3]);
      if((tag==='Xing'||tag==='Info')&&(b[xo+7]&1)){const fr=be32(b,xo+8);if(fr>0)return fr*spf/sr;}
      const vo=i+36;if(String.fromCharCode(b[vo],b[vo+1],b[vo+2],b[vo+3])==='VBRI'){const fr=be32(b,vo+14);if(fr>0)return fr*spf/sr;}
      return (file.size-off)*8/br;
    }
  }catch(e){}
  return 0;
}
function mediaDuration(blob){return new Promise(res=>{const url=URL.createObjectURL(blob);const a=new Audio();let done=false;const fin=v=>{if(done)return;done=true;URL.revokeObjectURL(url);a.removeAttribute('src');res(v)};a.preload='metadata';a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0);a.onerror=()=>fin(0);setTimeout(()=>fin(0),6000);a.src=url;});}
function avgColor(blob){return new Promise(res=>{if(!blob)return res(null);const url=URL.createObjectURL(blob);const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');x.drawImage(img,0,0,12,12);const d=x.getImageData(0,0,12,12).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);const w=1+(mx-mn)/40;r+=d[i]*w;g+=d[i+1]*w;b+=d[i+2]*w;n+=w;}r/=n;g/=n;b/=n;const f=Math.min(1,150/Math.max(r,g,b,1));res(`rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`)}catch(e){res(null)}URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url;});}

/* ================= library ops ================= */
function addMem(rec){
  const t=rec;
  if(t.cover&&!t.coverUrl){try{t.coverUrl=URL.createObjectURL(t.cover)}catch(e){}}
  S.tracks.set(t.id,t);if(!S.order.includes(t.id))S.order.push(t.id);
}
function cur(){return S.qi>=0?S.tracks.get(S.queue[S.qi]):null;}
async function importFiles(list){
  const files=[...list].filter(f=>/^audio\//.test(f.type)||/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name));
  if(!files.length){toast('Không tìm thấy file nhạc nào');return;}
  let added=0,skipped=0,failed=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    toast(`Đang thêm ${i+1}/${files.length}…`,60000);
    if([...S.tracks.values()].some(t=>t.name===f.name&&t.size===f.size)){skipped++;continue;}
    let blob;try{blob=new Blob([await f.arrayBuffer()],{type:f.type||'audio/mpeg'})}catch(e){blob=f;}
    const tags=await readTags(blob);
    let base=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim(),fa='',ft=base;
    const m=base.match(/^(.+?)\s+-\s+(.+)$/);if(m){fa=m[1].trim();ft=m[2].trim();}
    let dur=/\.mp3$/i.test(f.name)||f.type==='audio/mpeg'?await mp3Duration(blob,tags.tagEnd):0;
    if(!dur)dur=await mediaDuration(blob);
    const rec={id:uid(),name:f.name,size:f.size,blob,title:tags.title||ft,artist:tags.artist||fa||'Nghệ sĩ không xác định',album:tags.album||'',cover:tags.cover||null,color:await avgColor(tags.cover),duration:dur,added:Date.now()+i};
    if(!(await dbPut('tracks',toRec(rec))))failed++;
    addMem(rec);added++;
    if(i%5===4)refreshView();
  }
  toast(added?`Đã thêm ${added} bài hát${skipped?` (bỏ qua ${skipped} bài trùng)`:''}`:'Các bài này đã có trong thư viện',2600);
  if(failed)toast(`Không lưu được ${failed} bài vào bộ nhớ: các bài này sẽ mất khi đóng app`,6000);
  renderAll();
}
async function deleteTrack(id){
  const c=cur(),wasCur=c&&c.id===id;
  const nq=[];let nqi=-1;
  S.queue.forEach((x,i)=>{if(i===S.qi)nqi=nq.length;if(x!==id)nq.push(x);});
  S.queue=nq;S.baseList=S.baseList.filter(x=>x!==id);
  if(wasCur){audio.pause();audio.removeAttribute('src');try{audio.load()}catch(e){}S.qi=Math.min(nqi,nq.length-1);if(S.qi>=0)loadCurrent(false);}
  else S.qi=Math.min(nqi,nq.length-1);
  const t=S.tracks.get(id);if(t){if(t.url)URL.revokeObjectURL(t.url);if(t.coverUrl)URL.revokeObjectURL(t.coverUrl);}
  S.tracks.delete(id);S.order=S.order.filter(x=>x!==id);S.liked.delete(id);S.playlists.forEach(p=>p.ids=p.ids.filter(x=>x!==id));
  await dbDel('tracks',id);saveMeta();renderAll();toast('Đã xóa khỏi thư viện');
}
function toggleLike(id){if(!id)return;if(S.liked.has(id)){S.liked.delete(id);toast('Đã xóa khỏi Bài hát đã thích')}else{S.liked.add(id);toast('Đã thêm vào Bài hát đã thích')}saveMeta();renderSidebar();refreshView();renderPlayer();renderRight();}

function plById(id){return S.playlists.find(p=>p.id===id);}
function listForKey(key){
  if(key==='liked')return [...S.liked].filter(id=>S.tracks.has(id));

  const v=S.muted?0:S.volume;$('#pbMute').innerHTML=ic(v===0?'mute':'volume',18);const vr=$('#pbVol');vr.value=Math.round(v*100);vr.style.setProperty('--p',(v*100)+'%');

let seeking=null;
function updateProgress(){
  const t=cur();const d=audio.duration&&isFinite(audio.duration)?audio.duration:(t?t.duration:0);const c=audio.currentTime||0;const p=d?Math.min(100,c/d*100):0;
  $$('.seek').forEach(r=>{if(r===seeking)return;r.value=d?Math.round(c/d*1000):0;r.style.setProperty('--p',p+'%');});
  $$('.tcur').forEach(e=>{if(!seeking)e.textContent=fmtTime(c)});$$('.tdur').forEach(e=>e.textContent=fmtTime(d));
  $('#miniBar').style.width=p+'%';
}
function markPlaying(){const t=cur();const id=t?t.id:null;$$('.row[data-id]').forEach(r=>r.classList.toggle('playing',r.dataset.id===id));}

/* ================= playback ================= */
function playList(ids,start,ctx){
  if(!ids.length)return;
  S.baseList=ids.slice();S.context=ctx;
  if(start==null)start=S.shuffle?Math.floor(Math.random()*ids.length):0;
  if(S.shuffle){const first=ids[start];S.queue=[first,...shuffleArr(ids.filter((_,i)=>i!==start))];S.qi=0;}
  else{S.queue=ids.slice();S.qi=start;}
  loadCurrent(true);
}
let pendingSeek=0,stale=false;
try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
/* iOS: sau khi tạm dừng rồi khóa máy, đường tiếng có thể bị "chết" (thời gian chạy nhưng không có tiếng). Nạp lại nguồn phát trước khi phát tiếp. */
function resetAudio(){stale=false;try{audio.removeAttribute('src');audio.load();}catch(e){}}
function resume(){
  const t=cur();if(!t)return;
  if(stale&&t.url){const pos=audio.currentTime||0;resetAudio();pendingSeek=pos;audio.src=t.url;try{audio.load()}catch(e){}}
  const p=audio.play();if(p&&p.catch)p.catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&audio.paused)stale=true;});
audio.addEventListener('pause',()=>{if(document.hidden)stale=true;});
function loadCurrent(play){
  const t=cur();if(!t)return;
  if(!t.url){try{t.url=URL.createObjectURL(t.blob)}catch(e){toast('Không đọc được file này');return;}}
  if(stale)resetAudio();
  if(audio.getAttribute('src')!==t.url){audio.src=t.url;}else if(play){audio.currentTime=0;}
  if(play){const p=audio.play();if(p&&p.catch)p.catch(err=>{if(err&&err.name==='NotAllowedError')updatePlayIcons();else if(err&&err.name!=='AbortError')toast('Không phát được bài này');});}
  onTrackChange();
}
function onTrackChange(){renderPlayer();markPlaying();renderRight();renderSidebar();updatePlayIcons();setMediaSession();saveMeta();}
function togglePlay(){
  if(!cur()){const ids=listForKey('all');if(ids.length)playList(ids,null,{key:'all',label:'Tất cả bài hát'});else toast('Hãy thêm nhạc trước');return;}
  if(audio.paused){if(!audio.getAttribute('src'))loadCurrent(true);else resume();}else audio.pause();
}
function next(auto){
  if(!S.queue.length)return;
  if(auto&&S.repeat===2){audio.currentTime=0;resume();return;}
  if(S.qi<S.queue.length-1){S.qi++;loadCurrent(true);return;}
  if(S.shuffle)S.queue=shuffleArr(S.queue.slice());
  S.qi=0;loadCurrent(!auto||S.repeat===1);
}
function prev(){if(audio.currentTime>3||S.qi<=0){audio.currentTime=0;return;}S.qi--;loadCurrent(true);}
function setShuffle(on){
  S.shuffle=on;const c=cur();
  if(c){if(on){S.queue=[c.id,...shuffleArr(S.queue.filter((_,i)=>i!==S.qi))];S.qi=0;}else{const i=S.baseList.indexOf(c.id);if(i>=0){S.queue=S.baseList.slice();S.qi=i;}}}
  updateModes();renderRight();saveMeta();toast(on?'Đã bật trộn bài':'Đã tắt trộn bài',1400);
}
function cycleRepeat(){S.repeat=(S.repeat+1)%3;updateModes();renderRight();saveMeta();toast(['Đã tắt lặp lại','Lặp lại tất cả','Lặp lại một bài'][S.repeat],1400);}
function playNext(id){if(!cur()){playList([id],0,{key:'queue',label:'Hàng chờ'});return;}S.queue.splice(S.qi+1,0,id);renderRight();toast('Sẽ phát tiếp theo');}
function addQueue(id){if(!cur()){playList([id],0,{key:'queue',label:'Hàng chờ'});return;}S.queue.push(id);renderRight();toast('Đã thêm vào hàng chờ');}

audio.addEventListener('timeupdate',()=>{updateProgress();if(Math.floor(audio.currentTime)%5===0)saveMeta();});
audio.addEventListener('play',()=>{updatePlayIcons();if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing';});
audio.addEventListener('pause',()=>{updatePlayIcons();saveMeta();if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused';});
audio.addEventListener('ended',()=>next(true));
audio.addEventListener('loadedmetadata',()=>{
  const t=cur();if(pendingSeek){try{audio.currentTime=pendingSeek}catch(e){}pendingSeek=0;}
  if(t&&isFinite(audio.duration)&&Math.abs((t.duration||0)-audio.duration)>1.5){t.duration=audio.duration;dbPut('tracks',toRec(t));refreshView();}
  updateProgress();
});
audio.addEventListener('error',()=>{if(audio.getAttribute('src'))toast('Không phát được file này');});
window.addEventListener('pagehide',saveMetaNow);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveMetaNow();});

function setMediaSession(){
  if(!('mediaSession' in navigator))return;const t=cur();if(!t)return;
  const set=art=>{try{navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:t.album||'',artwork:art?[{src:art,sizes:'512x512',type:(t.cover&&t.cover.type)||'image/jpeg'}]:[]})}catch(e){}};
  set(null);
  if(t.cover){if(t._art)set(t._art);else{const fr=new FileReader();fr.onload=()=>{t._art=fr.result;if(cur()===t)set(t._art)};fr.readAsDataURL(t.cover);}}
}
function bindMS(){
  if(!('mediaSession' in navigator))return;
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('seekbackward',null);h('seekforward',null);
  h('play',resume);h('pause',()=>audio.pause());
  h('previoustrack',prev);h('nexttrack',()=>next(false));
  h('seekto',e=>{if(e.seekTime!=null)audio.currentTime=e.seekTime;});
}
bindMS();audio.addEventListener('playing',bindMS);

/* seek + volume */
document.addEventListener('input',e=>{
  const r=e.target;
  if(r.classList.contains('seek')){seeking=r;const t=cur();const d=audio.duration&&isFinite(audio.duration)?audio.duration:(t?t.duration:0);r.style.setProperty('--p',(r.value/10)+'%');const box=r.closest('.pb-prog,.sh-prog');if(box)$$('.tcur',box).forEach(x=>x.textContent=fmtTime(r.value/1000*d));}
  else if(r.id==='pbVol'){S.volume=r.value/100;S.muted=false;audio.volume=S.volume;audio.muted=false;r.style.setProperty('--p',r.value+'%');$('#pbMute').innerHTML=ic(S.volume===0?'mute':'volume',18);saveMeta();}
});
document.addEventListener('change',e=>{
  const r=e.target;
  if(r.classList.contains('seek')){const t=cur();const d=audio.duration&&isFinite(audio.duration)?audio.duration:(t?t.duration:0);if(d){if(audio.readyState>0)audio.currentTime=r.value/1000*d;else pendingSeek=r.value/1000*d;}seeking=null;updateProgress();}
});
['pointerup','touchend'].forEach(ev=>document.addEventListener(ev,()=>{if(seeking){const r=seeking;setTimeout(()=>{if(seeking===r){r.dispatchEvent(new Event('change',{bubbles:true}))}},50);}},{passive:true}));

/* ================= sheet (mobile now playing) ================= */
const sheet=$('#sheet');

(function(){

  const start=e=>{if(e.target.closest('.range,button'))return;y0=e.touches[0].clientY;dy=0;sheet.classList.add('dragging');};
  const move=e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);sheet.style.transform=`translateY(${dy}px)`;};
  const end=()=>{if(y0==null)return;sheet.classList.remove('dragging');sheet.style.transform='';if(dy>110)closeSheet();y0=null;};
  ['#shHead','#shCover'].forEach(s=>{const el=$(s);el.addEventListener('touchstart',start,{passive:true});el.addEventListener('touchmove',move,{passive:true});el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);});
})();

  const mob=isMobile();m.classList.toggle('sheet',mob);m.classList.add('open');
  if(!mob&&anchor){const r=anchor.getBoundingClientRect();const w=250,h=box.offsetHeight;let left=Math.min(r.right-w,innerWidth-w-8);left=Math.max(8,left);let top=r.bottom+4;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-4);box.style.left=left+'px';box.style.top=top+'px';}

  openMenu(items,anchor,`<div class="mhead">${coverHTML(t,'')}<div class="tt"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(t.artist)}</div></div></div>`);
}
function addToPl(pid,id){const p=plById(pid);if(!p)return;if(p.ids.includes(id)){toast(`Bài này đã có trong “${p.name}”`);return;}p.ids.push(id);saveMeta();renderSidebar();refreshView();toast(`Đã thêm vào “${p.name}”`);}
async function newPlaylist(ids=[]){
  const name=await askFields('Tạo danh sách phát',[{key:'name',label:'Tên',value:`Danh sách phát của tôi #${S.playlists.length+1}`}],'Tạo');
  if(!name||!name.name.trim())return;const p={id:uid(),name:name.name.trim(),ids:ids.slice(),created:Date.now()};S.playlists.push(p);saveMeta();go({name:'playlist',id:p.id});renderSidebar();toast('Đã tạo danh sách phát');
}
function plMenu(pid,anchor){
  const p=plById(pid);if(!p)return;
  openMenu([
    {icon:'edit',label:'Đổi tên',act:async()=>{const r=await askFields('Đổi tên danh sách phát',[{key:'name',label:'Tên',value:p.name}],'Lưu');if(r&&r.name.trim()){p.name=r.name.trim();if(S.context.key==='pl:'+p.id)S.context.label=p.name;saveMeta();renderAll();}}},
    {icon:'queue',label:'Thêm tất cả vào hàng chờ',act:()=>{p.ids.filter(id=>S.tracks.has(id)).forEach(id=>S.queue.push(id));if(!cur())playKey('pl:'+p.id);else{renderRight();toast('Đã thêm vào hàng chờ');}}},
    {icon:'trash',label:'Xóa danh sách phát',danger:1,act:async()=>{if(await confirmBox('Xóa danh sách phát?',`“${p.name}” sẽ bị xóa. Các bài hát vẫn còn trong thư viện.`,'Xóa')){S.playlists=S.playlists.filter(x=>x!==p);saveMeta();go({name:isMobile()?'library':'home'});renderSidebar();toast('Đã xóa danh sách phát');}}}
  ],anchor);
}
async function editTrack(id){
  const t=S.tracks.get(id);if(!t)return;
  const r=await askFields('Sửa thông tin',[{key:'title',label:'Tên bài hát',value:t.title},{key:'artist',label:'Nghệ sĩ',value:t.artist},{key:'album',label:'Album',value:t.album||''}],'Lưu');
  if(!r)return;t.title=r.title.trim()||t.title;t.artist=r.artist.trim()||'Nghệ sĩ không xác định';t.album=r.album.trim();
  await dbPut('tracks',toRec(t));renderAll();setMediaSession();toast('Đã lưu');
}
function modal(html,onOpen){return new Promise(res=>{const m=$('#modal'),b=$('#modalBox');b.innerHTML=html;m.classList.add('open');const done=v=>{m.classList.remove('open');res(v)};$('#modalBg').onclick=()=>done(null);onOpen(b,done);});}
function askFields(title,fields,ok){
  return modal(`<h3>${esc(title)}</h3><form id="mf">${fields.map(f=>`<label>${esc(f.label)}</label><input name="${f.key}" value="${esc(f.value)}" autocomplete="off">`).join('')}<div class="mbtns"><button type="button" class="btn ghost" data-x>Hủy</button><button type="submit" class="btn pri">${esc(ok)}</button></div></form>`,(b,done)=>{
    const f=$('#mf',b);f.onsubmit=e=>{e.preventDefault();const o={};fields.forEach(x=>o[x.key]=f.elements[x.key].value);done(o);};$('[data-x]',b).onclick=()=>done(null);
    if(!isMobile())setTimeout(()=>{const i=f.querySelector('input');i.focus();i.select();},30);
  });
}
function confirmBox(title,msg,ok){return modal(`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="mbtns"><button class="btn ghost" data-x>Hủy</button><button class="btn dng" data-ok>${esc(ok)}</button></div>`,(b,done)=>{$('[data-x]',b).onclick=()=>done(false);$('[data-ok]',b).onclick=()=>done(true);});}

/* ================= events ================= */
const fileInput=$('#file');
fileInput.addEventListener('change',()=>{const f=fileInput.files;if(f&&f.length)importFiles(f);fileInput.value='';});
function pickFiles(){try{fileInput.click()}catch(e){}}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;const row=el.closest('.row[data-id]');
  switch(act){
    case 'toggle':e.stopPropagation();togglePlay();break;
    case 'prev':prev();break;
    case 'next':next(false);break;
    case 'shuffle':setShuffle(!S.shuffle);break;
    case 'repeat':cycleRepeat();break;
    case 'mute':S.muted=!S.muted;audio.muted=S.muted;if(!S.muted&&S.volume===0){S.volume=.6;audio.volume=.6;}updateModes();saveMeta();break;
    case 'queue':
      if(isWide()){if(S.showRight&&S.rpMode==='queue'){S.rpMode='now';}else{S.showRight=true;S.rpMode='queue';}renderRight();updateModes();saveMeta();}
      else{if(S.view.name==='queue')back();else go({name:'queue'});updateModes();}
      break;
    case 'rp-now':S.rpMode='now';renderRight();updateModes();break;
    case 'rp-hide':S.showRight=false;renderRight();saveMeta();break;
    case 'nav':go({name:el.dataset.nav});break;
    case 'back':back();break;
    case 'open':e.stopPropagation();openKey(el.dataset.key);break;
    case 'open-ctx':if(S.context.key&&S.context.key!=='queue'&&S.context.key!=='recent'&&S.context.key!=='search')openKey(S.context.key);break;
    case 'play-key':e.stopPropagation();playKey(el.dataset.key);break;
    case 'recent':{const i=+el.dataset.i;playList(S.homeRecent,i,{key:'recent',label:'Mới thêm gần đây'});break;}
    case 'row':{const i=+el.dataset.i;const id=el.dataset.id;const c=cur();if(c&&c.id===id&&S.context.key===S.currentKey){togglePlay();break;}playList(S.currentList,i,{key:S.currentKey,label:labelForKey(S.currentKey)});break;}
    case 'like':e.stopPropagation();if(row)toggleLike(row.dataset.id);break;
    case 'more':e.stopPropagation();if(row)trackMenu(row.dataset.id,el);break;
    case 'like-current':e.stopPropagation();if(cur())toggleLike(cur().id);break;
    case 'cur-more':if(cur())trackMenu(cur().id,el);break;
    case 'cur-artist':e.stopPropagation();if(cur())go({name:'artist',id:cur().artist});break;
    case 'add-music':pickFiles();break;
    case 'new-pl':newPlaylist();break;
    case 'lib-plus':openMenu([{icon:'upload',label:'Thêm nhạc từ máy',act:pickFiles},{icon:'addList',label:'Tạo danh sách phát',act:()=>newPlaylist()}],el);break;
    case 'pl-more':plMenu(S.view.id,el);break;
    case 'pl-add':addToPl(S.view.id,el.dataset.id);break;
    case 'sort':openMenu([['added','Mới thêm gần đây'],['title','Tên bài (A–Z)'],['artist','Nghệ sĩ (A–Z)']].map(([k,l])=>({icon:S.sort===k?'check':'sort',label:l,act:()=>{S.sort=k;saveMeta();renderView();}})),el);break;
    case 'jump':S.qi=+el.dataset.qi;loadCurrent(true);break;
    case 'q-remove':{e.stopPropagation();const q=+el.dataset.qi;if(q>S.qi){S.queue.splice(q,1);renderRight();}break;}
    case 'open-sheet':openSheet();break;
    case 'close-sheet':closeSheet();break;
    case 'sheet-queue':$('#shQList').innerHTML=queueHTML();$('#shQueue').classList.add('open');break;
    case 'sheet-queue-close':$('#shQueue').classList.remove('open');break;
    case 'close-menu':closeMenu();break;
  }
});
document.addEventListener('contextmenu',e=>{const row=e.target.closest('.row[data-id]');if(row&&!isMobile()){e.preventDefault();const fake={getBoundingClientRect:()=>({right:e.clientX+250,bottom:e.clientY,top:e.clientY}),closest:s=>row.closest(s)};trackMenu(row.dataset.id,fake);}});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea'))return;
  if(e.key==='Escape'){closeMenu();if($('#modal').classList.contains('open'))$('#modalBg').click();return;}
  if(e.code==='Space'){e.preventDefault();togglePlay();}
  else if(e.key==='ArrowRight'){if(e.shiftKey||e.metaKey||e.ctrlKey)next(false);else if(cur())audio.currentTime=Math.min(audio.duration||0,audio.currentTime+5);}
  else if(e.key==='ArrowLeft'){if(e.shiftKey||e.metaKey||e.ctrlKey)prev();else if(cur())audio.currentTime=Math.max(0,audio.currentTime-5);}
});
/* drag & drop */
let dragDepth=0;
window.addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dragDepth++;$('#drop').classList.add('show');}});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').classList.remove('show');});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('#drop').classList.remove('show');if(e.dataTransfer&&e.dataTransfer.files.length)importFiles(e.dataTransfer.files);});
let lastMobile=isMobile();
window.addEventListener('resize',()=>{const m=isMobile();if(m!==lastMobile){lastMobile=m;closeMenu();renderAll();}else updateModes();});

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
/* ================= init ================= */
(async function init(){
  renderStatic();renderAll();
  db=await openDB();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  const recs=(await dbAll('tracks'))||[];
  recs.sort((a,b)=>a.added-b.added).forEach(addMem);
  const m=await loadMeta();
  if(m.liked)S.liked=new Set(m.liked.filter(id=>S.tracks.has(id)));
  if(Array.isArray(m.playlists))S.playlists=m.playlists;
  S.shuffle=!!m.shuffle;S.repeat=m.repeat|0;S.sort=m.sort||'added';
  if(typeof m.volume==='number')S.volume=m.volume;S.muted=!!m.muted;audio.volume=S.volume;audio.muted=S.muted;
  if(typeof m.showRight==='boolean')S.showRight=m.showRight;
  if(m.lastId&&S.tracks.has(m.lastId)){
    S.context=m.context&&m.context.key?m.context:{key:'all',label:'Tất cả bài hát'};
    let ids=listForKey(S.context.key);if(!ids.includes(m.lastId)){S.context={key:'all',label:'Tất cả bài hát'};ids=listForKey('all');}
    S.baseList=ids.slice();S.queue=ids.slice();S.qi=ids.indexOf(m.lastId);
    if(S.shuffle){S.queue=[m.lastId,...shuffleArr(ids.filter(x=>x!==m.lastId))];S.qi=0;}
    pendingSeek=m.lastTime||0;loadCurrent(false);
  }
  renderAll();
  if(!db)toast('Trình duyệt không cho lưu dữ liệu: nhạc sẽ mất khi tải lại trang',5000);
})();
</script>
</body>
